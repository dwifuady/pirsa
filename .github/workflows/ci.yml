name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build (x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Pirsa/Pirsa.csproj') }}
          restore-keys: nuget-

      # Pirsa.csproj sets a default RuntimeIdentifier, which makes the SDK infer
      # SelfContained=true. Both must be passed to restore, otherwise the
      # Microsoft.NETCore.App runtime pack is skipped and the build fails with
      # NETSDK1112.
      - name: Restore
        run: >
          dotnet restore Pirsa/Pirsa.csproj
          -r win-x64
          -p:Platform=x64
          -p:SelfContained=true

      - name: Build
        run: >
          dotnet build Pirsa/Pirsa.csproj
          -c Release
          -r win-x64
          -p:Platform=x64
          -p:SelfContained=true
          -p:PublishTrimmed=false
          --no-restore
