name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build (x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Pirsa/Pirsa.csproj') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore Pirsa/Pirsa.csproj -p:Platform=x64

      - name: Build
        run: dotnet build Pirsa/Pirsa.csproj -c Release -p:Platform=x64 --no-restore
